# Search baseline (#215): real queries, recorded before search changes, so later
# results can be compared with today's. DRAFT: to be edited and approved before the
# first results are recorded.
#
# Each query names the items it should find, as "source_type:source_id".
# kind:
#   title       words from the item's title
#   topic       the subject, in other words than the title's
#   paraphrase  meaning only; few or no words shared with the item
#   deep        text more than 500 characters into the item; semantic search embeds
#               only the title and first 500 characters, so only keyword search sees it
#
# Use words only, no "-", ":" or ",": the server passes them to FTS5, which reads
# "Dual-State" as column "State" and fails (hybrid then quietly runs semantic only).
#
# Run: uv run python scripts/search_baseline.py --url https://pop-mini.monkey-ladon.ts.net:8444

