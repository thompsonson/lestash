[project]
name = "lestash-takeout"
version = "1.97.0"
description = "Google Takeout (delivered to Drive) source plugin for Le Stash"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "lestash",
]

[project.entry-points."lestash.sources"]
takeout = "lestash_takeout:TakeoutSource"

[tool.uv.sources]
lestash = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestash_takeout"]
