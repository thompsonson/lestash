[project]
name = "lestash-kobo"
version = "1.70.1"
description = "Kobo eReader source plugin for Le Stash"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "lestash",
]

[project.entry-points."lestash.sources"]
kobo = "lestash_kobo:KoboSource"

[tool.uv.sources]
lestash = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestash_kobo"]
