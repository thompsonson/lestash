[project]
name = "lestash-gmail"
version = "1.68.0"
description = "Gmail source plugin for Le Stash (read-only, via the gws CLI)"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "lestash",
]

[project.entry-points."lestash.sources"]
gmail = "lestash_gmail:GmailSource"

[tool.uv.sources]
lestash = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestash_gmail"]
