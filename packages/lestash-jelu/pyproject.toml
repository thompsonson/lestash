[project]
name = "lestash-jelu"
version = "1.75.0"
description = "Jelu reading tracker source plugin for Le Stash"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "lestash",
    "httpx>=0.27.0",
]

[project.entry-points."lestash.sources"]
jelu = "lestash_jelu:JeluSource"

[tool.uv.sources]
lestash = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestash_jelu"]
