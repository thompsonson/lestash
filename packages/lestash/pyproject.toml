[project]
name = "lestash"
version = "1.75.0"
description = "Personal knowledge base CLI - aggregate content from multiple sources"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "docling>=2.84.0",
    "pymupdf>=1.27.0",
    "anthropic>=0.40.0",
    "markdownify>=1.1",
    "beautifulsoup4>=4.12.0",
    "tomli-w>=1.0",
]

[project.scripts]
lestash = "lestash.cli.main:app"

# Tests in every workspace package run in the test environment (lestash/testing.py)
[project.entry-points.pytest11]
lestash = "lestash.testing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestash"]
